format: 1
id: nightmanager
version: 1.5.0
name: NightManager
summary: Watches your services for you, writes evidence-based situation reports, files Jira tickets for what needs fixing, and keeps its own notes tidy.
apps:
  - app: grafana
    required: true
    level: ask
    tools:
      allow: [get_current_org, search, list_folders, get_folder, get_dashboard, list_datasources, get_datasource, check_datasource_health, prometheus_query, prometheus_query_range, prometheus_series, prometheus_labels, prometheus_label_values, list_alert_rule_states, list_alert_rules, get_alert_rule, list_alerts, list_annotations, list_contact_points, query_datasources]
      ask: [create_alert_rule, update_alert_rule, delete_alert_rule]
    why: Runs every report's queries and reads dashboards, alert state and contact points; sets tripwire alert rules for recurring problems, each waiting for your approval. Nothing else in Grafana changes.
  - app: jira-dc
    required: false
    level: ask
    why: Searches for existing tickets and files new ones. Creating or commenting on a ticket waits for your approval. Without it the agent only reports, and writes ticket drafts into the report.
  - app: gitlab
    required: false
    level: read
    why: Reads the service's configuration and recent changes (Puppet, Helm charts, application code) when a finding points at a deployment.
